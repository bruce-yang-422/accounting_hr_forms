<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找不到頁面｜表單填寫中心</title>
<meta http-equiv="refresh" content="5; url=/">
<link rel="icon" href="/assets/images/branding/form-center.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --c-navy: #7a3b10;
    --c-accent: #d4702a;
    --c-bg: #fdf5ef;
    --c-text: #4a2800;
    --c-muted: #9a6a4a;
    --c-border: #ead9cc;
    --c-head-grad: linear-gradient(135deg, #8b3e10 0%, #e07830 100%);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Noto Sans TC", -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
    color: var(--c-text);
    background:
      radial-gradient(circle at 50% 32%, rgba(255,255,255,.92) 0%, rgba(255,255,255,.72) 34%, rgba(255,255,255,0) 62%),
      linear-gradient(180deg, #fffaf6 0%, var(--c-bg) 100%);
  }

  .page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 20px 34px;
  }

  .scene {
    width: min(980px, 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    color: var(--c-navy);
    font-size: 14px;
    font-weight: 800;
    letter-spacing: .04em;
  }

  .brand img {
    width: 30px;
    height: 30px;
    object-fit: contain;
  }

  .not-found-art {
    width: clamp(320px, 72vw, 760px);
    max-width: 100%;
    display: block;
    object-fit: contain;
    filter: drop-shadow(0 18px 24px rgba(122,59,16,.12));
  }

  .message {
    width: min(620px, 100%);
    margin-top: -4px;
    padding: 16px 18px 18px;
    text-align: center;
  }

  .message h1 {
    margin: 0;
    color: var(--c-navy);
    font-size: 24px;
    font-weight: 800;
  }

  .message p {
    margin: 6px 0 0;
    color: var(--c-muted);
    font-size: 13.5px;
    line-height: 1.7;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 132px;
    margin-top: 14px;
    padding: 10px 18px;
    border-radius: 8px;
    background: var(--c-head-grad);
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 800;
    box-shadow: 0 8px 18px rgba(139,62,16,.18);
    transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
  }

  .btn:hover {
    transform: translateY(-1px);
    filter: brightness(1.04);
    box-shadow: 0 10px 22px rgba(139,62,16,.22);
  }

  .redirect-note {
    margin-top: 10px;
    color: var(--c-muted);
    font-size: 12px;
  }

  @media (max-width: 700px) {
    .page { padding: 22px 14px 28px; }
    .brand { margin-bottom: 4px; }
    .not-found-art { width: min(100%, 520px); }
    .message {
      margin-top: 0;
      padding: 12px 8px 14px;
    }
    .message h1 { font-size: 21px; }
  }
</style>
</head>
<body>
  <main class="page">
    <div class="scene">
      <div class="brand">
        <img src="/assets/images/branding/form-center.ico" alt="">
        <span>表單填寫中心</span>
      </div>

      <img class="not-found-art" src="/assets/images/branding/not-found-cats-dogs.png" alt="找不到頁面的貓狗插圖">

      <section class="message" aria-labelledby="notFoundTitle">
        <h1 id="notFoundTitle">找不到這個頁面</h1>
        <p>網址可能輸入錯誤，或頁面已經移動。系統會自動帶你回到首頁。</p>
        <a class="btn" href="/">回到首頁</a>
        <div class="redirect-note">5 秒後自動返回首頁</div>
      </section>
    </div>
  </main>
</body>
</html>
