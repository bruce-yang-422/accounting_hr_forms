<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找不到頁面｜表單填寫中心</title>
<meta http-equiv="refresh" content="5; url=/">
<link rel="icon" href="/assets/images/branding/form-center-windows.ico" type="image/x-icon" sizes="256x256">
<link rel="icon" href="/assets/images/branding/form-center-favicon.ico" type="image/x-icon" sizes="16x16 32x32 48x48">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --c-navy: #7a3b10;
    --c-accent: #d4702a;
    --c-bg: #fdf5ef;
    --c-text: #4a2800;
    --c-muted: #9a6a4a;
    --c-border: #ead9cc;
    --c-head-grad: linear-gradient(135deg, #8b3e10 0%, #e07830 100%);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Noto Sans TC", -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
    color: var(--c-text);
    background:
      radial-gradient(circle at 50% 32%, rgba(255,255,255,.92) 0%, rgba(255,255,255,.72) 34%, rgba(255,255,255,0) 62%),
      linear-gradient(180deg, #fffaf6 0%, var(--c-bg) 100%);
  }

  .page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 20px 34px;
  }

  .scene {
    width: min(980px, 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    color: var(--c-navy);
    font-size: 14px;
    font-weight: 800;
    letter-spacing: .04em;
  }

  .brand img {
    width: 30px;
    height: 30px;
    object-fit: contain;
  }

  .not-found-art {
    width: clamp(320px, 72vw, 760px);
    max-width: 100%;
    display: block;
    object-fit: contain;
    filter: drop-shadow(0 18px 24px rgba(122,59,16,.12));
  }

  .message {
    width: min(620px, 100%);
    margin-top: -4px;
    padding: 16px 18px 18px;
    text-align: center;
  }

  .message h1 {
    margin: 0;
    color: var(--c-navy);
    font-size: 24px;
    font-weight: 800;
  }

  .message p {
    margin: 6px 0 0;
    color: var(--c-muted);
    font-size: 13.5px;
    line-height: 1.7;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 132px;
    margin-top: 14px;
    padding: 10px 18px;
    border-radius: 8px;
    background: var(--c-head-grad);
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 800;
    box-shadow: 0 8px 18px rgba(139,62,16,.18);
    transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
  }

  .btn:hover {
    transform: translateY(-1px);
    filter: brightness(1.04);
    box-shadow: 0 10px 22px rgba(139,62,16,.22);
  }

  .redirect-note {
    margin-top: 10px;
    color: var(--c-muted);
    font-size: 12px;
  }

  @media (max-width: 700px) {
    .page { padding: 22px 14px 28px; }
    .brand { margin-bottom: 4px; }
    .not-found-art { width: min(100%, 520px); }
    .message {
      margin-top: 0;
      padding: 12px 8px 14px;
    }
    .message h1 { font-size: 21px; }
  }
</style>
<link rel="stylesheet" href="/assets/css/icons.css">
</head>
<body>
<!-- SVG ICONS:START -->
<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" width="0" height="0" style="position:absolute;overflow:hidden">
  <!-- Original 24-unit line icons for the form center. -->
  <symbol id="icon-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v11h5v-6h4v6h5V9"/></symbol>
  <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18m-14 4h3m4 0h3m-10 4h3"/><path d="m14 17 1.5 1.5L19 15"/></symbol>
  <symbol id="icon-payment" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Zm0 0v6h6M8 12h3m-3 4h3"/><path d="M17 12v7m2-6h-3a1.5 1.5 0 0 0 0 3h1a1.5 1.5 0 0 1 0 3h-3"/></symbol>

  <symbol id="icon-travel" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M8 8V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v3M3 14h18m-11-1v2m4-2v2"/></symbol>
  <symbol id="icon-purchase" viewBox="0 0 24 24"><path d="M2 3h3l3 12h11l2-8H6"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></symbol>
  <symbol id="icon-forms" viewBox="0 0 24 24"><rect x="5" y="5" width="15" height="16" rx="2"/><path d="M9 5V3H3v15m6-9h7m-7 4h7m-7 4h4"/></symbol>

  <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2 12S5.5 5 12 5s10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="icon-printer" viewBox="0 0 24 24"><path d="M7 8V3h10v5M7 17H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-3M7 14h10v7H7Z"/><path d="M17 11h2"/></symbol>
  <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-3a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v3Zm5-5 3 3 3-3"/></symbol>
  <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V3h8v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></symbol>
  <symbol id="icon-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/></symbol>
  <symbol id="icon-arrow-left" viewBox="0 0 24 24"><path d="M20 12H4m6-6-6 6 6 6"/></symbol>
  <symbol id="icon-arrow-right" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
  <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="icon-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>
  <symbol id="icon-checkbox" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1"/></symbol>
  <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Zm0 0v6h6M12 18v-7m-3 3 3-3 3 3"/></symbol>
</svg>
<!-- SVG ICONS:END -->
  <main class="page">
    <div class="scene">
      <div class="brand">
        <img src="/assets/images/branding/form-center-logo.png" alt="">
        <span>表單填寫中心</span>
      </div>

      <img class="not-found-art" src="/assets/images/branding/not-found-cats-dogs.png" alt="找不到頁面的貓狗插圖">

      <section class="message" aria-labelledby="notFoundTitle">
        <h1 id="notFoundTitle">找不到這個頁面</h1>
        <p>網址可能輸入錯誤，或頁面已經移動。系統會自動帶你回到首頁。</p>
        <a class="btn" href="/">回到首頁</a>
        <div class="redirect-note">5 秒後自動返回首頁</div>
      </section>
    </div>
  </main>
</body>
</html>
