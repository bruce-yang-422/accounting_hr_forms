<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找不到頁面</title>
<meta http-equiv="refresh" content="5; url=./index.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --c-navy: #7a3b10;
    --c-accent: #d4702a;
    --c-bg: #fdf5ef;
    --c-card: #ffffff;
    --c-text: #4a2800;
    --c-muted: #9a6a4a;
    --c-border: #ead9cc;
    --c-head-grad: linear-gradient(135deg, #8b3e10 0%, #e07830 100%);
    --shadow: 0 8px 28px rgba(139,62,16,.14);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: "Noto Sans TC", -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
    color: var(--c-text);
    background:
      radial-gradient(circle at top right, rgba(212,112,42,.12), transparent 32%),
      linear-gradient(180deg, #fffaf6 0%, var(--c-bg) 100%);
  }

  .card {
    width: min(680px, 100%);
    background: var(--c-card);
    border: 1.5px solid var(--c-border);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .card-head {
    padding: 18px 24px;
    background: var(--c-head-grad);
    color: #fff;
  }

  .card-head h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: .04em;
  }

  .card-head p {
    margin: 6px 0 0;
    font-size: 13px;
    opacity: .82;
  }

  .card-body {
    padding: 28px 24px 24px;
  }

  .code {
    font-size: 56px;
    line-height: 1;
    font-weight: 800;
    color: var(--c-accent);
    margin-bottom: 16px;
  }

  .message {
    font-size: 16px;
    line-height: 1.8;
    margin-bottom: 18px;
  }

  .hint {
    font-size: 13px;
    color: var(--c-muted);
    margin-bottom: 22px;
  }

  .actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 146px;
    padding: 11px 18px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    transition: .18s ease;
  }

  .btn-primary {
    background: var(--c-head-grad);
    color: #fff;
  }

  .btn-secondary {
    background: #fff7f2;
    color: var(--c-navy);
    border: 1.5px solid var(--c-border);
  }

  .btn:hover {
    transform: translateY(-1px);
  }
</style>
</head>
<body>
  <main class="card">
    <div class="card-head">
      <h1>表單填寫中心</h1>
      <p>表單填寫中心</p>
    </div>
    <div class="card-body">
      <div class="code">404</div>
      <div class="message">
        找不到您要前往的頁面。<br>
        可能是網址有誤、頁面已移動，或您直接開啟了不存在的連結。
      </div>
      <div class="hint">
        系統將於 5 秒後自動返回首頁，您也可以直接使用下方按鈕。
      </div>
      <div class="actions">
        <a class="btn btn-primary" href="./index.html">回到首頁</a>
        <a class="btn btn-secondary" href="./forms/leave_request_form.html">前往請假單</a>
        <a class="btn btn-secondary" href="./forms/payment_request_form.html">前往請款單</a>
      </div>
    </div>
  </main>
</body>
</html>
